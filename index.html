<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grundgerüst Webseite</title>

<!-- ================= CSS ================= -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }

  /* ---------- Kopfbereich mit Logo ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10px 20px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
  }

  .logo {
    width: 60px;
    height: 60px;
    background: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .site-title { font-size: 1.3rem; }

  /* ---------- Diashow (volle Breite) ---------- */
  .slideshow {
    position: relative;
    width: 100%;
    height: 320px;
    overflow: hidden;
    background: #000;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #fff;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .slide.active { opacity: 1; }

  .slide:nth-child(1) { background: #3b6ea5; }
  .slide:nth-child(2) { background: #a55d3b; }
  .slide:nth-child(3) { background: #3ba56b; }

  .slide-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,.45);
    color: #fff;
    border: none;
    font-size: 1.6rem;
    padding: 10px 16px;
    cursor: pointer;
  }
  .slide-btn:hover { background: rgba(0,0,0,.7); }
  #prev { left: 0; }
  #next { right: 0; }

  .dots {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
  }
  .dot {
    display: inline-block;
    width: 12px; height: 12px;
    margin: 0 4px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    cursor: pointer;
  }
  .dot.active { background: #fff; }

  /* ---------- Reiter / Tabs ---------- */
  nav.tabs {
    display: flex;
    background: #2c3e50;
    flex-wrap: wrap;
  }

  nav.tabs button {
    flex: 1 1 auto;
    padding: 14px 20px;
    background: none;
    border: none;
    color: #cfd8e3;
    font-size: 1rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }

  nav.tabs button:hover { background: #34495e; color: #fff; }

  nav.tabs button.active {
    color: #fff;
    border-bottom-color: #f39c12;
    background: #34495e;
  }

  /* ---------- Inhaltsbereich ---------- */
  main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .tab-content {
    display: none;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    line-height: 1.6;
  }

  .tab-content.active { display: block; }

  h2 { margin-bottom: 12px; }

  footer {
    text-align: center;
    padding: 20px;
    color: #666;
    font-size: .9rem;
  }

  @media (max-width: 600px) {
    .slideshow { height: 200px; }
    nav.tabs button { flex: 1 1 50%; }
  }
</style>
</head>

<body>

<!-- ================= HTML ================= -->

<!-- Logo oben links -->
<header>
  <div class="logo">LOGO</div>
  <div class="site-title">Meine Webseite</div>
</header>

<!-- Diashow über die ganze Breite -->
<div class="slideshow">
  <div class="slide active">Bild 1</div>
  <div class="slide">Bild 2</div>
  <div class="slide">Bild 3</div>

  <button class="slide-btn" id="prev">&#10094;</button>
  <button class="slide-btn" id="next">&#10095;</button>

  <div class="dots"></div>
</div>

<!-- Reiter -->
<nav class="tabs">
  <button class="active" data-tab="start">Start</button>
  <button data-tab="ueber">Über uns</button>
  <button data-tab="leistungen">Leistungen</button>
  <button data-tab="kontakt">Kontakt</button>
</nav>

<!-- Inhalt unter den Reitern -->
<main>
  <section class="tab-content active" id="start">
    <h2>Start</h2>
    <p>Hier steht der Inhalt der Startseite.</p>
  </section>

  <section class="tab-content" id="ueber">
    <h2>Über uns</h2>
    <p>Hier steht der Inhalt zu „Über uns“.</p>
  </section>

  <section class="tab-content" id="leistungen">
    <h2>Leistungen</h2>
    <p>Hier steht der Inhalt zu den Leistungen.</p>
  </section>

  <section class="tab-content" id="kontakt">
    <h2>Kontakt</h2>
    <p>Hier stehen die Kontaktdaten.</p>
  </section>
</main>

<footer>© 2026 Meine Webseite</footer>

<!-- ================= JavaScript ================= -->
<script>
  /* ---------- Diashow ---------- */
  const slides = document.querySelectorAll('.slide');
  const dotsBox = document.querySelector('.dots');
  let index = 0;
  let timer;

  slides.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => { showSlide(i); resetTimer(); });
    dotsBox.appendChild(d);
  });

  const dots = document.querySelectorAll('.dot');

  function showSlide(i) {
    index = (i + slides.length) % slides.length;
    slides.forEach((s, n) => s.classList.toggle('active', n === index));
    dots.forEach((d, n) => d.classList.toggle('active', n === index));
  }

  function nextSlide() { showSlide(index + 1); }
  function prevSlide() { showSlide(index - 1); }

  function startTimer() { timer = setInterval(nextSlide, 4000); }
  function resetTimer() { clearInterval(timer); startTimer(); }

  document.getElementById('next').addEventListener('click', () => { nextSlide(); resetTimer(); });
  document.getElementById('prev').addEventListener('click', () => { prevSlide(); resetTimer(); });

  startTimer();

  /* ---------- Reiter / Tabs ---------- */
  const tabButtons = document.querySelectorAll('nav.tabs button');
  const tabContents = document.querySelectorAll('.tab-content');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));

      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });
</script>

</body>
</html>
