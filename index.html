<!-- ================= CSS ================= -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    background: #fefefe;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- Kopfbereich mit Logo ---------- */
 .hero {
  position: relative;
  width: 100%;
  height: 50vh;
  min-height: 200px;
  overflow: hidden;
}

/* Diashow füllt den Hero komplett */
  .slideshow {
  position: relative;
  width: 100%;
  height: 50vh;
  min-height: 100px;
  overflow: hidden;
  background: #111;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.slide.active {
  opacity: 1;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Abdunkelung, damit Logo und Text lesbar bleiben */
.slideshow::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.55) 0%,
    rgba(0,0,0,0.25) 50%,
    rgba(0,0,0,0.45) 100%
  );
  z-index: 2;
  pointer-events: none;
}

  h1 { font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 6vw, 4rem);
  color: #fff;
  text-align:  center;
  text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  letter-spacing: 0.01em; }

/* Header liegt über den Bildern */
.hero-header {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: left;
  justify-content: left;
  text-align: left;
  padding: 20px;
  pointer-events: none;
}
  /* ---------- Reiter / Tabs ---------- */
  nav.tabs {
    display: flex;
    background: #66cdaa;
    flex-wrap: wrap;
  }

  nav.tabs button {
    flex: 1 1 auto;
    padding: 14px 20px;
    background: none;
    border: none;
    color: #000000;
    font-size: 1rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }

  nav.tabs button:hover { background: #458b74; color: #fff; }

  nav.tabs button.active {
    color: #fff;
    border-bottom-color: #f39c12;
    background: #458b74;
  }
  

  /* ---------- Inhaltsbereich ---------- */
  main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .tab-content {
    display: none;
    gap: 20px;
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
    line-height: 1.6;
  }

  .rechtes-bild {
  max-width: 300px; /* Bestimmt die maximale Größe des Bildes */
  height: fit-content;
  float: right;
}
  .vorstand-bild {
  max-width: 150px; /* Bestimmt die maximale Größe des Bildes */
  height: fit-content;
  float: right;
}


 [data-content] {
  opacity: 0;
  transition: opacity .3s ease;
}

body.geladen [data-content] {
  opacity: 1;
}

 
  .tab-content.active { display: block; }

  /* Überschrift */
h2 {
  font-family: "Montserrat", Arial, sans-serif;
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: #1f2937;
  margin: 0 0 0.5rem;
}

/* Unterüberschrift */
h3 {
  font-family: "Montserrat", Arial, sans-serif;
  font-size: clamp(1.35rem, 2.5vw, 2rem);
  font-weight: 600;
  line-height: 1.3;
  color: #64748b;
  margin: 1rem 0 0.5rem;
}

  footer {
    text-align: center;
    padding: 20px;
    color: #666;
    font-size: .9rem;
  }

  @media (max-width: 600px) {
    .slideshow { height: 200px; }
    nav.tabs button { flex: 1 1 50%; }
  }

  .tabs {
  display: flex;
  gap: 4px;
  position: relative;   /* wichtig */
  
}

.tab-wrapper {
   display: flex;
   flex-direction: column;
  gap: 4px;
  position: relative; 
  flex: 1 1 auto;


}

.tab-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 300px;
  margin: 0;
  padding: 6px 0;
  background: #fff;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.16);

  opacity: 0;
  visibility: hidden;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  z-index: 1500;
  display: flex;
  flex-direction: column;


}

.tab-wrapper:hover .tab-dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.tab-dropdown a {
  display: inline-block;
  padding: 11px 18px;
  color: #222;
  text-decoration: none;
  font-size: 0.95rem;
  transition: background 0.15s, padding-left 0.15s;
}

.tab-dropdown a:hover {
  background: #f4f4f4;
  padding-left: 24px;
}

  p {
    white-space: pre-line;

  }

.fi-mail::before {
  content: "\f16d";
}




</style>

<!-- ================= JavaScript ================= -->
<script>
  /* ---------- Diashow ---------- */

let current = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
let timer = setInterval(() => changeSlide(1), 4000);

function showSlide(n) {
  current = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
}

function changeSlide(step) {
  showSlide(current + step);
}

function goToSlide(n) {
  showSlide(n);
  clearInterval(timer);
  timer = setInterval(() => changeSlide(1), 4000);
}
/* ---------- Reiter / Tabs ---------- */
  const tabButtons = document.querySelectorAll('nav.tabs button');
  const tabContents = document.querySelectorAll('.tab-content');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));

      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });


 fetch("content.json")
  .then(response => response.json())
  .then(data => {
    document.querySelectorAll("[data-content]").forEach(element => {
      const wert = element.dataset.content
        .split(".")
        .reduce((objekt, schlüssel) => objekt?.[schlüssel], data);

      if (!wert) return;

      if (element.tagName === "IMG") {
        // Bildpfad aus dem JSON in src einsetzen
        element.src = wert;
      } else {
        // HTML-Inhalt für h2, p usw.
        element.innerHTML = wert;
      }
    });

    document.body.classList.add("geladen");
  })
  .catch(error => {
    console.error("content.json konnte nicht geladen werden:", error);
  });

 
</script>
